name: modele-memoire
on: [push, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        machine: [ubuntu-24.04, ubuntu-24.04-arm]   # x86 puis ARM64
    runs-on: ${{ matrix.machine }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - run: uname -m && nproc
      - run: javac MessagePassing.java MessagePassing2.java StoreBuffering.java
      - run: for i in 1 2 3; do java -Xint MessagePassing  | grep perdu; done
      - run: for i in 1 2 3; do java -Xint MessagePassing2 | grep perdu; done
      - run: java MessagePassing2 | grep perdu
