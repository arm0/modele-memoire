name: modele-memoire
on: [push, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        machine: [ubuntu-24.04, ubuntu-24.04-arm]   # x86 puis ARM64
    runs-on: ${{ matrix.machine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: uname -m && nproc
      - run: javac MessagePassing.java StoreBuffering.java
      - run: java -Xint MessagePassing
      - run: java MessagePassing
      - run: java -Xint StoreBuffering
